[project]
name = "smart-scene-studio"
version = "0.1.0-alpha.1"
requires-python = ">=3.14.2"
dependencies = ["homeassistant==2026.11.0"]

[dependency-groups]
test = [
  "home-assistant-frontend==20261028.4",
  "pytest==9.0.3",
  "pytest-homeassistant-custom-component==0.13.375",
  "ruff==0.14.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
override-dependencies = ["homeassistant==2026.11.0"]
